<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aurora 注册页面练习" />
    <title>创建账户 | Aurora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro-panel" aria-label="产品介绍">
        <div class="brand-mark" aria-label="Aurora">
          <span class="brand-icon">✦</span>
          <span>Aurora</span>
        </div>

        <div class="intro-copy">
          <p class="eyebrow">WELCOME TO AURORA</p>
          <h1>把每一个<br /><span>好想法</span>变成日常。</h1>
          <p class="intro-text">创建你的 Aurora 账户，整理灵感、管理计划，和团队一起把想法推进到下一步。</p>
        </div>

        <div class="testimonial">
          <div class="avatar-stack" aria-hidden="true">
            <span>林</span><span>M</span><span>周</span><span>+</span>
          </div>
          <p>已经有超过 20,000 位创作者在 Aurora 开始行动。</p>
        </div>
      </section>

      <section class="form-panel" aria-labelledby="form-title">
        <div class="form-wrap">
          <div class="form-heading">
            <p class="mobile-brand">✦ Aurora</p>
            <p class="eyebrow">CREATE YOUR ACCOUNT</p>
            <h2 id="form-title">创建账户</h2>
            <p>已经有账户？<a href="#login" id="loginLink">直接登录</a></p>
          </div>

          <form id="registerForm" novalidate>
            <div class="field-row">
              <div class="field-group">
                <label for="name">姓名</label>
                <input id="name" name="name" type="text" autocomplete="name" placeholder="请输入你的姓名" />
                <small class="field-error" id="nameError"></small>
              </div>
              <div class="field-group">
                <label for="username">用户名</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="例如 aurora_user" />
                <small class="field-error" id="usernameError"></small>
              </div>
            </div>

            <div class="field-group">
              <label for="email">邮箱地址</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" />
              <small class="field-error" id="emailError"></small>
            </div>

            <div class="field-group">
              <label for="password">设置密码</label>
              <div class="password-input">
                <input id="password" name="password" type="password" autocomplete="new-password" placeholder="至少 8 个字符" />
                <button class="toggle-password" type="button" data-target="password" aria-label="显示密码">显示</button>
              </div>
              <div class="strength-meter" aria-label="密码强度">
                <span></span><span></span><span></span><span></span>
              </div>
              <small class="strength-text" id="strengthText">密码强度：未设置</small>
              <small class="field-error" id="passwordError"></small>
            </div>

            <div class="field-group">
              <label for="confirmPassword">确认密码</label>
              <div class="password-input">
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码" />
                <button class="toggle-password" type="button" data-target="confirmPassword" aria-label="显示密码">显示</button>
              </div>
              <small class="field-error" id="confirmPasswordError"></small>
            </div>

            <label class="checkbox-label" for="terms">
              <input id="terms" name="terms" type="checkbox" />
              <span>我已阅读并同意 <a href="#terms">服务条款</a> 和 <a href="#privacy">隐私政策</a></span>
            </label>
            <small class="field-error terms-error" id="termsError"></small>

            <button class="submit-button" type="submit">创建我的账户 <span aria-hidden="true">→</span></button>
            <p class="form-note">注册即表示你同意 Aurora 的服务条款。</p>
            <div class="success-message" id="successMessage" role="status" aria-live="polite"></div>
          </form>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
